<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>销售佣金数据看板 · Demo</title>
<style>
:root{
  --ink:#25333C; --sub:#6C7E8A; --line:#E3EAEE; --bg:#F5F8F9; --card:#FFFFFF;
  --blue:#4F82A8; --blue-d:#3C6C90; --blue-l:#EDF4F8; --blue-b:#CFE0EB;
  --teal:#6BA292; --teal-l:#E9F2EF; --teal-b:#CFE3DC;
  --neg:#BF6F66; --neg-l:#FAEDEB;
  --warn:#B4874F; --warn-l:#FCF4E7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;padding:22px 18px 60px}
.wrap{max-width:1240px;margin:0 auto}
a{color:var(--blue)}
/* ---- header ---- */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:6px}
h1{font-size:21px;font-weight:600;letter-spacing:.2px}
h1 small{font-weight:400;font-size:12px;color:var(--sub);margin-left:8px;letter-spacing:0}
.meta{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.7}
.ghost{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:7px;
  padding:6px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.ghost:hover{border-color:var(--blue-b);color:var(--blue)}
/* ---- section ---- */
h2{font-size:13px;font-weight:600;color:var(--ink);margin:26px 0 9px;display:flex;align-items:baseline;gap:8px}
h2 i{font-style:normal;color:var(--blue);font-weight:600;font-size:12px;letter-spacing:.5px}
h2 em{font-style:normal;font-size:11.5px;color:var(--sub);font-weight:400}
.panel{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:15px 16px}
/* ---- filters ---- */
.fbar{display:flex;flex-wrap:wrap;gap:9px 12px}
.fg{display:flex;flex-direction:column;gap:4px;min-width:112px;flex:0 0 auto}
.fg label{font-size:11px;color:var(--sub);letter-spacing:.2px;display:flex;align-items:center;gap:3px}
.fg select,.fg input{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12.5px;
  background:#fff;color:var(--ink);outline:none;min-width:112px;font-family:inherit}
.fg select:focus,.fg input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.fg.wide{min-width:172px}
.fg.wide input,.fg.wide select{min-width:172px}
.tip{font-size:11px;color:var(--sub);background:var(--bg);border-radius:6px;padding:3px 6px;margin-top:1px}
.finfo{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);font-size:12px;color:var(--sub);
  display:flex;flex-wrap:wrap;gap:16px}
.finfo b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.finfo .clr{color:var(--blue);cursor:pointer}
/* ---- cards ---- */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 14px;position:relative;overflow:hidden}
.card .k{font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:5px}
.card .v{font-size:21px;font-weight:600;margin-top:5px;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
.card .x{font-size:11px;color:var(--sub);margin-top:3px}
.card.pay{background:linear-gradient(180deg,var(--teal-l),#fff 72%);border-color:var(--teal-b)}
.card.pay .v{color:var(--teal)}
.card.neg .v{color:var(--neg)}
.card.blue{background:linear-gradient(180deg,var(--blue-l),#fff 72%);border-color:var(--blue-b)}
.card .split{display:flex;gap:0;margin-top:6px;font-size:11px;color:var(--sub)}
.card .split div{flex:1}
.card .split b{display:block;font-size:13px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
/* ---- composition ---- */
.comps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cbox{border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:#fff}
.cbox h3{font-size:12px;font-weight:600;margin-bottom:9px;display:flex;justify-content:space-between;align-items:baseline}
.cbox h3 span{font-size:11px;color:var(--sub);font-weight:400}
.crow{display:grid;grid-template-columns:88px 1fr 74px 44px;align-items:center;gap:8px;
  padding:3px 0;font-size:12px}
.crow .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .bar{height:14px;background:var(--bg);border-radius:3px;overflow:hidden;position:relative}
.crow .bar i{display:block;height:100%;border-radius:3px;background:var(--blue);transition:width .35s ease}
.crow .bar i.t{background:var(--teal)}
.crow .bar i.n{background:var(--neg)}
.crow .amt{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.crow .qt{text-align:right;font-variant-numeric:tabular-nums;color:var(--sub);font-size:11.5px}
.crow.more{color:var(--blue);cursor:pointer;font-size:11.5px;grid-template-columns:1fr;padding-top:6px}
.crow.more:hover{text-decoration:underline}
.cempty{font-size:12px;color:var(--sub);padding:8px 0}
/* ---- trend ---- */
.trend{display:flex;align-items:flex-end;gap:26px;height:210px;padding:14px 6px 0;position:relative}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.tcol .tb{width:74px;max-width:78%;background:linear-gradient(180deg,var(--blue),#7FA8C4);border-radius:5px 5px 0 0;
  position:relative;transition:height .45s cubic-bezier(.22,.7,.3,1);min-height:2px}
.tcol .tb.part{background:repeating-linear-gradient(135deg,#8FB4CB,#8FB4CB 6px,#AFCCDD 6px,#AFCCDD 12px)}
.tcol .tv{font-size:13px;font-weight:600;margin-bottom:6px;font-variant-numeric:tabular-nums}
.tcol .tl{font-size:12px;color:var(--sub);margin-top:9px}
.tcol .tq{font-size:11px;margin-top:3px;font-variant-numeric:tabular-nums}
.tcol .tq.up{color:var(--neg)}
.tcol .tq.down{color:var(--teal)}
.tcol .tq.na{color:var(--sub)}
.tbar-line{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.tnote{font-size:11.5px;color:var(--sub);margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);line-height:1.75}
/* ---- rank ---- */
.rhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 12px;font-size:12px;color:var(--sub);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--blue);color:#fff}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--sub);font-weight:500;background:#FBFDFD;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--blue-l)}
tbody tr.neg td.num{color:var(--neg)}
.tblbox{max-height:430px;overflow:auto;border:1px solid var(--line);border-radius:9px}
.rk1{display:inline-block;width:19px;height:19px;line-height:19px;text-align:center;border-radius:5px;
  background:var(--blue-l);color:var(--blue-d);font-size:11px;font-weight:600}
.rk1.t1{background:#DFEBF3;color:#36617F}.rk1.t2{background:#E7F0F5}.rk1.t3{background:#EFF5F8}
.badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;background:var(--bg);color:var(--sub)}
.badge.b{background:var(--blue-l);color:var(--blue-d)}
.badge.t{background:var(--teal-l);color:#4B7F71}
.badge.w{background:var(--warn-l);color:var(--warn)}
/* ---- check ---- */
.chk{display:grid;grid-template-columns:1fr;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.chk table{font-size:12.5px}
.chk td,.chk th{padding:9px 11px}
.chk .ok{color:var(--teal);font-weight:600}
.audit{margin-top:13px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.abox{border:1px solid var(--warn-l);background:var(--warn-l);border-radius:9px;padding:11px 13px;font-size:12px;line-height:1.7}
.abox b{color:var(--warn);font-size:12px;display:block;margin-bottom:3px}
.abox.i{border-color:var(--blue-b);background:var(--blue-l)}
.abox.i b{color:var(--blue-d)}
/* ---- drawer ---- */
.mask{position:fixed;inset:0;background:rgba(28,42,52,.28);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,94vw);background:#fff;z-index:41;
  transform:translateX(102%);transition:transform .28s cubic-bezier(.22,.7,.3,1);display:flex;flex-direction:column;
  box-shadow:-12px 0 40px rgba(30,50,65,.12)}
.drawer.on{transform:none}
.dh{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}
.dh h3{font-size:17px;font-weight:600}
.dh .dsub{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.7}
.dclose{border:0;background:var(--bg);width:28px;height:28px;border-radius:7px;cursor:pointer;color:var(--sub);font-size:15px}
.dbody{padding:16px 20px 40px;overflow:auto;flex:1}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.dstat{background:var(--bg);border-radius:9px;padding:10px 11px}
.dstat .k{font-size:11px;color:var(--sub)}
.dstat .v{font-size:16px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.dsec{font-size:12px;font-weight:600;margin:16px 0 7px;color:var(--ink);display:flex;justify-content:space-between}
.dsec span{font-weight:400;color:var(--sub);font-size:11px}
/* ---- misc ---- */
.miss{margin-top:13px;font-size:12px;color:var(--sub);line-height:1.85;background:var(--bg);
  border-radius:9px;padding:12px 14px;border-left:3px solid var(--blue-b)}
.miss b{color:var(--ink);font-weight:600}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--sub);line-height:1.85}
.hide{display:none!important}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.comps{grid-template-columns:1fr}.audit{grid-template-columns:1fr}}
@media(max-width:620px){.cards{grid-template-columns:1fr}.trend{gap:10px}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>销售佣金数据看板<small>Demo v1.1</small></h1>
    <div class="meta" id="hMeta"></div>
  </div>
  <button class="ghost" id="btnMask">显示真名</button>
</header>

<h2><i>①</i>数据筛选 <em>时间口径统一为结算月份；身份 / 部门职位 / 队伍为三个独立维度，不可互相替代</em></h2>
<div class="panel">
  <div class="fbar" id="fbar"></div>
  <div class="finfo" id="finfo"></div>
</div>

<h2><i>②</i>佣金概览 <em>金额为佣金净额＝正向＋负向冲减，计算逻辑沿用源表口径</em></h2>
<div class="cards" id="cards"></div>

<h2><i>③</i>佣金构成 <em>条形长度＝该组净额占最大组的比例；同时给出金额与单量</em></h2>
<div class="comps" id="comps"></div>

<h2><i>④</i>月度趋势 <em>按结算月份，不受「结算月份」筛选影响，其余筛选联动</em></h2>
<div class="panel">
  <div class="trend" id="trend"></div>
  <div class="tnote" id="tnote"></div>
</div>

<h2><i>⑤</i>人员排名与销售明细 <em>只做应付佣金排名；点任意一行查看这个人到底卖了什么</em></h2>
<div class="panel">
  <div class="rhead">
    <div class="seg" id="segRange">
      <button data-r="month" class="on">按所选月份</button>
      <button data-r="all">三个月累计</button>
    </div>
    <div style="font-size:12px;color:var(--sub)" id="rkInfo"></div>
  </div>
  <div class="tblbox">
    <table id="tblRank">
      <thead><tr>
        <th style="width:44px">#</th><th>姓名</th><th>身份</th><th>企微职位</th><th>部门</th><th>队伍</th>
        <th class="num">应付佣金</th><th class="num">订单量</th><th class="num">流水笔数</th><th class="num">占比</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="miss" id="rkNote"></div>
</div>

<h2><i>⑥</i>应付与实付核对 <em>人力实际支付与财务实际支付分开列示，不合并为单一实付</em></h2>
<div class="panel">
  <div class="chk"><table id="tblChk">
    <thead><tr>
      <th>结算月</th><th class="num">应付佣金</th><th class="num">人力实付</th>
      <th class="num">财务实付</th><th class="num">未付</th><th>闭合校验</th><th>说明</th>
    </tr></thead><tbody></tbody>
  </table></div>
  <div class="audit" id="audit"></div>
  <div class="miss" id="chkMiss"></div>
</div>

<div class="foot" id="foot"></div>
</div>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="dh">
    <div><h3 id="dName"></h3><div class="dsub" id="dSub"></div></div>
    <button class="dclose" id="dClose">×</button>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>

      <input id="q" placeholder="输入姓名或 11 位手机号" autocomplete="off"></div>`;
  bar.querySelectorAll('select').forEach(s=>s.onchange=e=>{

  });
  const q = document.getElementById('q');
  q.oninput = e => { ST.q = e.target.value.trim(); render(); };
}
function pass(r, skipMonth){
  if(!skipMonth && ST.m!=='all' && r.m!==ST.m) return false;
  return (ST.ro==='all'||r.ro===ST.ro) &&
    (ST.dd==='all'||r.dd===ST.dd) &&
    (ST.gw==='all'||r.gw===ST.gw) &&
    (ST.tm==='all'||r.tm===ST.tm) &&
    (ST.ct==='all'||r.ct===ST.ct) &&
    (ST.it==='all'||r.it===ST.it) &&
    (ST.ch==='all'||r.ch===ST.ch) &&
    (ST.me==='all'||r.me===ST.me) &&
    (!ST.q || (r.nm||'').includes(ST.q) || (r.ph||'').includes(ST.q));
}
function matched(){ return ROWS.filter(r=>pass(r,false)); }
function matchedNoMonth(){ return ROWS.filter(r=>pass(r,true)); }

/* ---------------- 聚合 ---------------- */
function agg(rows, key){
  const map = new Map();
  rows.forEach(r=>{
    const k = r[key]||'';
    if(!map.has(k)) map.set(k,{k, amt:0, pos:0, ref:0, orders:new Set(), posOrders:new Set(), refOrders:new Set(), cnt:0});
    const o = map.get(k);
    o.amt += r.a; o.cnt++;
    o.orders.add(r.oid);
    if(r.d==='负向'){ o.ref += r.a; o.refOrders.add(r.oid); }
    else { o.pos += r.a; o.posOrders.add(r.oid); }
  });
  return [...map.values()].sort((a,b)=>b.amt-a.amt);
}

const COMP = [
  {key:'ro', title:'按人员身份'},
  {key:'tm', title:'按队伍'},

  {key:'dd', title:'按部门'},

const EXPAND = {};
function renderComps(rows){
  const host = document.getElementById('comps');
  const total = rows.reduce((s,r)=>s+r.a,0) || 1;
  host.innerHTML = COMP.map(c=>{
    const g = agg(rows, c.key).map(x=>({...x, k: x.k || '未标注'}))
                             .sort((a,b)=>b.amt-a.amt);
    if(!g.length) return `<div class="cbox"><h3>${c.title}</h3><div class="cempty">当前筛选下无数据</div></div>`;
    const maxAbs = Math.max(...g.map(x=>Math.abs(x.amt)))||1;
    const show = EXPAND[c.key] ? g : g.slice(0,6);
    const body = show.map(x=>{
      const w = Math.max(1.2, Math.abs(x.amt)/maxAbs*100);
      const cls = x.amt<0?'n':(c.key==='ch'?'t':'');
      const od = c.key==='dd' ? x.posOrders.size : x.orders.size;
      return `<div class="crow" title="${esc(x.k)}｜净额 ${money(x.amt)}｜${x.cnt} 笔｜${od} 单">
        <div class="nm">${esc(x.k||'未标注')}</div>
        <div class="bar"><i class="${cls}" style="width:${w}%"></i></div>
        <div class="amt">${money(x.amt)}</div>
        <div class="qt">${num(od)} 单</div></div>`;
    }).join('');
    const more = g.length>6 ? `<div class="crow more" data-more="${c.key}">${EXPAND[c.key]?'收起':'展开其余 '+(g.length-6)+' 项'}</div>` : '';
    const sum = g.reduce((s,x)=>s+x.amt,0);
    return `<div class="cbox"><h3>${c.title}<span>${g.length} 类 · 合计 ${money(sum)}</span></h3>${body}${more}</div>`;
  }).join('');
  host.querySelectorAll('[data-more]').forEach(el=>el.onclick=()=>{
    const k = el.dataset.more; EXPAND[k]=!EXPAND[k]; renderComps(rows);
  });
}

/* ---------------- 趋势 ---------------- */
function renderTrend(rows){
  const months = ['2026-07','2026-08','2026-09'];
  const data = months.map(m=>{
    const sub = rows.filter(r=>r.m===m);
    return {m, ap: sub.reduce((s,r)=>s+r.a,0), n: sub.length};
  });
  const maxV = Math.max(...data.map(d=>d.ap), 1);
  const host = document.getElementById('trend');
  host.innerHTML = data.map((d,i)=>{
    const prev = i>0 ? data[i-1].ap : null;
    const qoq = (prev && Math.abs(prev)>0.005) ? (d.ap-prev)/Math.abs(prev) : null;
    const cls = i===0 ? 'part' : '';
    const h = Math.max(2, d.ap/maxV*100);
    return `<div class="tcol">
      <div class="tv">${money0(d.ap)}</div>
      <div class="tb ${cls}" style="height:${h}%"></div>
      <div class="tl">${MON[d.m]}</div>
      <div class="tq ${qoq===null?'na':(qoq>0?'up':'down')}">${qoq===null?'无环比基数':(qoq>0?'▲ ':'▼ ')+pct(Math.abs(qoq))}</div>
    </div>`;
  }).join('');
  const d7=data[0].ap, d8=data[1].ap, d9=data[2].ap;
  document.getElementById('tnote').innerHTML =
    `<b>环比：</b>8 月较 7 月 ${d8>=d7?'+':''}${pct((d8-d7)/Math.abs(d7||1))}，9 月较 8 月 ${d9>=d8?'+':''}${pct((d9-d8)/Math.abs(d8||1))}。

let RANGE = 'month';
function baseRows(rows){
  if(RANGE==='all') return matchedNoMonth();
  if(ST.m!=='all') return rows.filter(r=>r.m===ST.m);
  return rows;
}
function rankRows(rows){
  const base = baseRows(rows);
  const map = new Map();
  base.forEach(r=>{
    const k = r.sid || ('nm:'+r.nm);
    if(!map.has(k)) map.set(k,{k, nm:r.nm, ph:r.ph, ro:r.ro, dd:r.dd, gw:r.gw, tm:r.tm,
      amt:0, orders:new Set(), cnt:0, pos:0, ref:0, months:new Set()});
    const o = map.get(k);
    o.amt += r.a; o.cnt++; o.orders.add(r.oid); o.months.add(r.m);
    if(r.d==='负向') o.ref += r.a; else o.pos += r.a;
    if(!o.ph && r.ph) o.ph = r.ph;
    if(!o.ro && r.ro) o.ro = r.ro;
    if(!o.dd && r.dd) o.dd = r.dd;
    if(!o.gw && r.gw) o.gw = r.gw;
  });
  return [...map.values()].sort((a,b)=>b.amt-a.amt);
}

     <span>应付净额 <b>${money(net)}</b></span>
     <span>已启用 <b>${act}</b> 个筛选</span>
     ${act?`<span class="clr" id="clr">清空筛选</span>`:''}`;
  const clr = document.getElementById('clr');
  if(clr) clr.onclick = ()=>{
    Object.keys(ST).forEach(k=>ST[k] = (k==='q'?'':'all'));
    document.querySelectorAll('#fbar select').forEach(s=>s.value='all');
    document.getElementById('q').value='';
    render();
  };
  renderCards(rows);
  renderComps(rows);
  renderTrend(matchedNoMonth());
  renderRank(rows);
}

   姓名与手机号默认脱敏，右上角可切真名 ｜ 本页含业务敏感数据，勿外传`;
document.getElementById('btnMask').onclick = e => {
  MASK = !MASK; e.target.textContent = MASK?'显示真名':'隐藏真名'; render();
};
document.getElementById('segRange').onclick = e => {

  document.querySelectorAll('#segRange button').forEach(x=>x.classList.toggle('on', x===b));
